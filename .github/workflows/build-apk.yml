name: Build APK Gratis

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ============================================
      # EXEL WA TRANSLATOR - INSTALL APP ICON
      # ============================================

      - name: Extract Android App Icon
        run: |
          echo "Extracting Exel WA Translator icon..."

          unzip -o Exel_WA_Translator_Android_Icon_Pack.zip -d icon_pack

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp icon_pack/app/src/main/res/mipmap-mdpi/ic_launcher.png \
             app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp icon_pack/app/src/main/res/mipmap-mdpi/ic_launcher_round.png \
             app/src/main/res/mipmap-mdpi/ic_launcher_round.png

          cp icon_pack/app/src/main/res/mipmap-hdpi/ic_launcher.png \
             app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp icon_pack/app/src/main/res/mipmap-hdpi/ic_launcher_round.png \
             app/src/main/res/mipmap-hdpi/ic_launcher_round.png

          cp icon_pack/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
             app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp icon_pack/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png \
             app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

          cp icon_pack/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
             app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp icon_pack/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png \
             app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          cp icon_pack/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cp icon_pack/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png \
             app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo "Icon installed successfully."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Command-Line Tools 22.0
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --version
          java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Exel-WA-Translator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
